id: ai.opencode.opencode
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: run.sh
rename-desktop-file: ai.opencode.desktop.desktop
rename-icon: ai.opencode.desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: git
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
    cleanup:
      - /share
    make-args:
      - NO_PERL=1
      - NO_TCLTK=1
    make-install-args:
      - INSTALL_SYMLINKS=1
      - NO_PERL=1
      - NO_TCLTK=1
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.gz
        sha256: 826817fd3671b8565586d6d49f688298de8354ab11db829c02720e5c74b9b39f
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://www.kernel.org/pub/software/scm/git/git-$version.tar.gz

  - name: opencode
    buildsystem: simple
    build-options:
      # flatpak-builder's debuginfo phase runs eu-strip on every ELF file,
      # which rewrites opencode-cli and drops Bun's appended payload: the
      # result is a plain bun binary ("Script not found" for every command,
      # bun's version for --version). Disable the phase for this module.
      no-debuginfo: true
    build-commands:
      - ar x opencode-desktop-linux*.deb
      - tar xf data.tar.xz
      - patch -p1 < metainfo.patch
      - mv opt/* /app/main
      - rm /app/main/chrome-sandbox
      - mv usr/share/applications usr/share/icons /app/share
      - desktop-file-edit --set-key Exec --set-value "run.sh %U" /app/share/applications/ai.opencode.desktop.desktop
      - patch-electron-desktop-filename /app/main/resources/app.asar
      - install -Dm644 usr/share/metainfo/ai.opencode.desktop.metainfo.xml /app/share/metainfo/ai.opencode.opencode.metainfo.xml
      - install -Dm755 -t /app/bin run.sh
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://opencode.ai/files/bin/2.1.3/opencode-desktop-linux-amd64.deb
        sha256: 5476fd98195cd447f16f3e7ca1c301b771f267fb3e345c7df869061fccaca150
        x-checker-data:
          type: regex
          url: https://opencode.ai/update/api/latest/desktop/opencode/latest-linux.yml
          version-query: 'version: (.+)'
          url-template: https://opencode.ai/files/bin/$version/opencode-desktop-linux-amd64.deb
      - type: file
        only-arches: [aarch64]
        url: https://opencode.ai/files/bin/2.1.3/opencode-desktop-linux-arm64.deb
        sha256: e12d51367bf75773d4604459e1a41bea7ef6e4ea6819574f80287b36bfbecf27
        x-checker-data:
          type: regex
          url: https://opencode.ai/update/api/latest/desktop/opencode/latest-linux-arm64.yml
          version-query: 'version: (.+)'
          url-template: https://opencode.ai/files/bin/$version/opencode-desktop-linux-arm64.deb
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/ai.opencode.desktop "$@"
      - type: file
        path: metainfo.patch
