id: ai.opencode.opencode
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.sh
rename-desktop-file: ai.opencode.desktop.desktop
rename-icon: ai.opencode.desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: git
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
    cleanup:
      - /share
    make-args:
      - NO_PERL=1
      - NO_TCLTK=1
    make-install-args:
      - INSTALL_SYMLINKS=1
      - NO_PERL=1
      - NO_TCLTK=1
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.gz
        sha256: 0842dc384a23ac33ba3e570c4f3a8ded85963ee4713b1cd21153c3db41813d1e
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://www.kernel.org/pub/software/scm/git/git-$version.tar.gz

  - name: opencode
    buildsystem: simple
    build-commands:
      - ar x opencode-desktop-linux*.deb
      - tar xf data.tar.xz
      - patch -p1 < metainfo.patch
      - mv opt/* /app/main
      - rm /app/main/chrome-sandbox
      - mv usr/share/applications usr/share/icons /app/share
      - desktop-file-edit --set-key Exec --set-value "run.sh %U" /app/share/applications/ai.opencode.desktop.desktop
      - patch-electron-desktop-filename /app/main/resources/app.asar
      - python3 patch-opencode-asar.py /app/main/resources/app.asar
      - install -Dm644 usr/share/metainfo/ai.opencode.desktop.metainfo.xml /app/share/metainfo/ai.opencode.opencode.metainfo.xml
      - install -Dm755 -t /app/bin run.sh
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/anomalyco/opencode/releases/download/v1.18.23/opencode-desktop-linux-amd64.deb
        sha256: 4fb07956d46b11b0280803efae69e050fe9bc33d72541c30cf1a1a3fdaabcc46
        x-checker-data:
          type: json
          url: https://api.github.com/repos/anomalyco/opencode/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="opencode-desktop-linux-amd64.deb")
            | .browser_download_url
      - type: file
        only-arches: [aarch64]
        url: https://github.com/anomalyco/opencode/releases/download/v1.18.23/opencode-desktop-linux-arm64.deb
        sha256: 77301db41d5068e011e95f0e0169d35f653f537f7eca81e64229ed3694b4fb17
        x-checker-data:
          type: json
          url: https://api.github.com/repos/anomalyco/opencode/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="opencode-desktop-linux-arm64.deb")
            | .browser_download_url
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/ai.opencode.desktop "$@"
      - type: file
        path: metainfo.patch
      - type: file
        path: patch-opencode-asar.py
